name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy-neocities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bcomnes/deploy-to-neocities@v3
        with:
          api_key: ${{ secrets.NEOCITIES_API_KEY }}
          dist_dir: .
          cleanup: true
